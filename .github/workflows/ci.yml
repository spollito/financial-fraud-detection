name: Fraud pipeline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: fraud fixture --output data/fixtures/ci
      - run: fraud inspect --dataset synthetic --data data/fixtures/ci --output reports/runs/ci-eda
      - run: fraud train --dataset synthetic --data data/fixtures/ci --output reports/runs/ci-baseline --evaluate-test

  spark:
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -c constraints.txt -e ".[dev,spark]"
      - run: python -m pytest -q tests/integration/test_spark.py
      - run: fraud fixture --output data/fixtures/spark-ci
      - run: fraud preprocess --dataset synthetic --data data/fixtures/spark-ci --output data/processed/spark-ci
      - run: fraud train --dataset synthetic --processed data/processed/spark-ci --output reports/runs/spark-ci
