name: Phase 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: fraud fixture --output data/fixtures/ci
      - run: fraud inspect --dataset synthetic --data data/fixtures/ci --output reports/runs/ci-eda
      - run: fraud train --dataset synthetic --data data/fixtures/ci --output reports/runs/ci-baseline --evaluate-test
