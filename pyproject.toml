[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-fraud-detection"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib==1.5.2",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.3"]
spark = ["pyspark==4.0.1", "pyarrow==22.0.0"]

[project.scripts]
fraud = "fraud_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
